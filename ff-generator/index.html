<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLORAL FORGER 設計圖產生器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #eee;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.3em; margin-bottom: 5px; color: #f5a623; }
    .subtitle { color: #666; font-size: 0.85em; margin-bottom: 20px; }
    
    .stats-row {
      display: flex; gap: 8px; margin-bottom: 15px;
      flex-wrap: wrap; justify-content: center;
    }
    .stat-input {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.05);
      padding: 4px 8px; border-radius: 5px; font-size: 0.8em;
    }
    .stat-input label { color: #888; }
    .stat-input input {
      width: 40px; background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px; padding: 3px;
      color: #fff; text-align: center; font-size: 0.85em;
    }
    
    .draw-btn {
      padding: 10px 35px; font-size: 1em;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      border: none; border-radius: 20px;
      color: #fff; cursor: pointer; font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }
    .draw-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.3);
    }
    .draw-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .card {
      width: 300px;
      background: linear-gradient(180deg, #252535 0%, #1a1a28 100%);
      border-radius: 12px; overflow: hidden;
      border: 2px solid #333;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .card.grade-爛 { border-color: #555; }
    .card.grade-普 { border-color: #4ecdc4; }
    .card.grade-好 { border-color: #ffe66d; }
    .card.grade-奇 { border-color: #ff6b6b; box-shadow: 0 8px 25px rgba(255,107,107,0.3); }
    .card.grade-奇‽ { border-color: #ff6b6b; animation: glow 1.5s infinite; }
    @keyframes glow {
      0%, 100% { box-shadow: 0 8px 25px rgba(255,107,107,0.3); }
      50% { box-shadow: 0 8px 35px rgba(255,107,107,0.6); }
    }
    
    .card-header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .card-grade { font-size: 0.85em; margin-bottom: 3px; }
    .grade-爛 { color: #888; }
    .grade-普 { color: #4ecdc4; }
    .grade-好 { color: #ffe66d; }
    .grade-奇, .grade-奇‽ { color: #ff6b6b; }
    .card-prefix { font-size: 0.9em; color: #aaa; margin-bottom: 5px; }
    .card-weapon { font-size: 1.4em; font-weight: bold; color: #fff; }
    
    .card-info {
      padding: 12px 15px; background: rgba(0,0,0,0.2);
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; font-size: 0.85em;
    }
    .info-item { display: flex; justify-content: space-between; }
    .info-label { color: #666; }
    .info-value { color: #fff; }
    .info-value.metal { color: #f5a623; }
    .info-value.wood { color: #7ed321; }
    .info-value.price { color: #f5576c; }
    .info-value.ep { color: #4ecdc4; }
    
    .card-effects {
      padding: 10px 15px;
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.8em;
    }
    .effect-title { color: #666; margin-bottom: 5px; }
    .effect-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .effect-tag {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px; border-radius: 10px;
    }
    .effect-tag.positive { color: #7ed321; }
    .effect-tag.negative { color: #f5576c; }
    .effect-tag.special { color: #f5a623; background: rgba(245,166,35,0.2); }
    
    .card-comments { padding: 12px 15px; }
    .comment-line {
      display: flex; align-items: flex-start; gap: 6px;
      margin-bottom: 6px; font-size: 0.8em; line-height: 1.4;
    }
    .comment-line:last-child { margin-bottom: 0; }
    .comment-icon { flex-shrink: 0; }
    .comment-text { color: #bbb; }
    
    .placeholder { color: #444; font-size: 0.9em; padding: 60px 20px; text-align: center; }
    .loading { color: #f5a623; }
  </style>
</head>
<body>
  <h1>📜 FLORAL FORGER</h1>
  <p class="subtitle">設計圖產生器</p>
  
  <div class="stats-row">
    <div class="stat-input"><label>💪STR</label><input type="number" id="str" value="30" min="0" max="100"></div>
    <div class="stat-input"><label>🧠INT</label><input type="number" id="int" value="30" min="0" max="100"></div>
    <div class="stat-input"><label>🏃DEX</label><input type="number" id="dex" value="40" min="0" max="100"></div>
    <div class="stat-input"><label>🍀LUCK</label><input type="number" id="luck" value="50" min="0" max="100"></div>
    <div class="stat-input"><label>😊MOOD</label><input type="number" id="mood" value="50" min="0" max="100"></div>
  </div>
  
  <button class="draw-btn" id="drawBtn" onclick="draw()" disabled>🎴 載入中...</button>
  
  <div class="card" id="card">
    <div class="placeholder loading">正在載入資料...</div>
  </div>

  <script src="design-generator.js"></script>
</body>
</html>
