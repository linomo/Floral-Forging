<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刀劍鍛造師徒弟 - FF_E 完整版</title>
    <style>
        :root { --border: #5d4037; --bg: #fdfaf6; --main-brown: #8d6e63; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: #eee; display: flex; justify-content: center; margin: 0; padding: 10px; }
        .game-world { width: 100%; max-width: 800px; background: var(--bg); border: 3px solid var(--border); display: flex; flex-direction: column; height: 98vh; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        
        /* 狀態區 */
        .status-bar { padding: 12px; background: #efebe9; border-bottom: 2px solid var(--border); font-size: 0.95em; }
        .status-line { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center; }
        .mood-container { width: 120px; height: 10px; background: #ccc; border-radius: 5px; overflow: hidden; margin-left: 8px; }
        #mood-bar { height: 100%; background: linear-gradient(to right, #ff5252, #ffeb3b, #4caf50); transition: 0.5s; }
        .money-text { color: #b8860b; font-weight: bold; }

        /* 劇情區 (固定 10 行左右) */
        #story-area { height: 180px; padding: 15px; overflow-y: auto; border-bottom: 2px solid #ddd; background: #fff; line-height: 1.6; font-size: 1em; }

        /* 互動區 */
        .interaction-zone { flex: 1; display: flex; border-bottom: 2px solid var(--border); min-height: 150px; }
        .location-nav { width: 110px; border-right: 2px solid #ddd; display: flex; flex-direction: column; background: #f5f5f5; }
        .action-pad { flex: 1; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; align-content: start; }
        .nav-btn { padding: 15px 5px; border: none; border-bottom: 1px solid #ddd; cursor: pointer; font-weight: bold; background: none; font-size: 0.9em; }
        .nav-btn.active { background: var(--border); color: white; }
        .action-btn { padding: 12px; background: var(--main-brown); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .action-btn:hover { background: #6d4c41; }

        /* 下方背包區 */
        .inventory-zone { height: 180px; display: grid; grid-template-columns: repeat(3, 1fr); background: #f9f9f9; }
        .bag-column { border-right: 1px solid #ddd; padding: 8px; overflow-y: auto; }
        .bag-title { font-size: 0.8em; font-weight: bold; text-align: center; border-bottom: 1px solid #ddd; margin-bottom: 6px; padding-bottom: 3px; color: var(--border); }
        .item-slot { font-size: 0.85em; background: white; padding: 4px 8px; margin-bottom: 4px; border: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="game-world">
    <div class="status-bar">
        <div class="status-line">
            <div>📅 <span id="date-display">墨玲元年一月一日</span></div>
            <div>👤 <b>小哈</b></div>
        </div>
        <div class="status-line">
            <div class="money-text">💰 靈石：<span id="s-money">0</span></div>
            <div style="display:flex; align-items:center;">
                心情：<span id="mood-text">平凡</span>
                <div class="mood-container"><div id="mood-bar"></div></div>
            </div>
        </div>
        <div class="status-line" style="font-size: 0.9em; color: #444;">
            <span>💪 力量:<span id="s-str">3</span></span>
            <span>🧠 智力:<span id="s-int">5</span></span>
            <span>🏃 敏捷:<span id="s-agi">4</span></span>
            <span>🔋 體力:<span id="s-sta">6</span>/10</span>
        </div>
    </div>

    <div id="story-area">系統讀取中...</div>

    <div class="interaction-zone">
        <div class="location-nav">
            <button class="nav-btn active" onclick="changeLoc('房間')">🏠 房間</button>
            <button class="nav-btn" onclick="changeLoc('庭院')">🌳 庭院</button>
            <button class="nav-btn" onclick="changeLoc('鍛造室')">⚒️ 鍛造室</button>
        </div>
        <div class="action-pad" id="action-buttons"></div>
    </div>

    <div class="inventory-zone">
        <div class="bag-column"><div class="bag-title">材料 (金屬)</div><div id="bag-materials"></div></div>
        <div class="bag-column"><div class="bag-title">成品 (刀劍)</div><div id="bag-products"></div></div>
        <div class="bag-column"><div class="bag-title">書架 (知識)</div><div id="bag-books"></div></div>
    </div>
</div>

<script>
    let actionDatabase = [];
    let eventDatabase = [];
    let player = {
        name: "小哈", money: 0, mood: 50,
        stats: { "s-str": 3, "s-int": 5, "s-agi": 4, "s-sta": 6 },
        date: { year: 1, mon: 1, day: 1 },
        location: "房間",
        inv: { materials: [], products: [], books: [{n:"初階小小書", c:1}] }
    };

    async function loadCSV(file) {
        const response = await fetch(file);
        const text = await response.text();
        const rows = text.split('\n').map(row => row.split(',').map(cell => cell.trim()));
        const headers = rows[0];
        return rows.slice(1).filter(row => row.length >= headers.length).map(row => {
            let obj = {};
            headers.forEach((header, i) => obj[header] = row[i]);
            return obj;
        });
    }

    async function initGame() {
        try {
            actionDatabase = await loadCSV('FF_E_Act.csv');
            eventDatabase = await loadCSV('FF_E_Event.csv');
            log("讀取成功。你在床頭醒來，看著窗外。");
            updateUI();
        } catch (e) {
            log("<span style='color:red;'>[錯誤] 無法讀取 CSV 檔案，請確認檔名是否為 FF_E_Act.csv 與 FF_E_Event.csv 且已上傳。</span>");
        }
    }

    function checkCondition(currentVal, conditionStr) {
        if (!conditionStr || conditionStr === "") return true;
        if (conditionStr.includes("&")) {
            let parts = conditionStr.split("&");
            let low = parseFloat(parts[0].replace(/[<>=]/g, ""));
            let high = parseFloat(parts[1].replace(/[<>=]/g, ""));
            return currentVal >= Math.min(low, high) && currentVal <= Math.max(low, high);
        }
        if (conditionStr.startsWith(">=")) return currentVal >= parseFloat(conditionStr.substring(2));
        if (conditionStr.startsWith("<=")) return currentVal <= parseFloat(conditionStr.substring(2));
        if (conditionStr.startsWith(">")) return currentVal > parseFloat(conditionStr.substring(1));
        if (conditionStr.startsWith("<")) return currentVal < parseFloat(conditionStr.substring(1));
        return false;
    }

    function applyStatChange(statName, value) {
        if (!statName || statName === "") return;
        if (statName === "money") {
            player.money += parseInt(value);
        } else if (statName === "mood") {
            player.mood = Math.max(0, Math.min(100, player.mood + parseFloat(value)));
        } else if (player.stats[statName] !== undefined) {
            if (statName === "s-sta") {
                player.stats[statName] = Math.round((player.stats[statName] + parseFloat(value)) * 10) / 10;
            } else {
                player.stats[statName] = Math.max(0, player.stats[statName] + parseFloat(value));
            }
        }
    }

    function handleRandomEvent(actName) {
        let prob = Math.random();
        // 尋找對應動作的隨機事件
        let ev = eventDatabase.find(e => e.Column_B === actName && prob < (parseFloat(e.Probability)/100));
        
        if (ev) {
            let changes = [];
            // 讀取 Stat_1, Stat_2, Stat_3 (與對應的 Val)
            for (let i = 1; i <= 3; i++) {
                let sKey = i === 1 ? "Stat_1" : `Stat_${i}`;
                let vKey = i === 1 ? "Change_Value" : `Val_${i}`;
                
                // 修正你的 CSV 欄位名稱差異，相容 Change_Value 或 Val_i
                let sName = ev[sKey] || ev[`Change_Stat_${i}`]; 
                let vVal = ev[vKey] || ev[`Change_Value_${i}`];

                if (sName && sName !== "") {
                    applyStatChange(sName, vVal);
                    changes.push(`${sName} ${vVal > 0 ? '+' : ''}${vVal}`);
                }
            }
            log(`<span style="color:goldenrod;">★事件：${ev.Content} (${changes.join(', ')})</span>`);
        }
    }

    function doAction(actName) {
        let currentReqVal = (actName === "睡覺") ? player.mood : player.stats["s-str"];
        let match = actionDatabase.find(d => 
            d.Action === actName && 
            d.Loc === player.location && 
            checkCondition(currentReqVal, d.Req_Value)
        );

        if (!match) return;

        // 1. 執行基礎動作
        let finalChange = parseFloat(match.Change_Value) * parseFloat(match.Weighted);
        applyStatChange(match.Change_Stat, finalChange);
        log(match.Content);

        // 2. 隨機事件
        if (match["R_E_Check?"] === "1") {
            handleRandomEvent(actName);
        }

        // 3. 睡覺邏輯：正常加一天
        if (actName === "睡覺") {
            player.date.day += 1;
            player.stats["s-sta"] = Math.min(10, player.stats["s-sta"]); // 確保睡醒體力上限
        }

        // 4. 透支判定
        if (player.stats["s-sta"] <= 0 && actName !== "睡覺") {
            log("<br><span style='color:red; font-weight:bold;'>[！！體力透支！！]</span>");
            log("<span style='color:red;'>你眼前一黑，徹底脫力昏倒在地上...</span>");
            
            player.date.day += 2; // 強制跳到後天
            player.stats["s-sta"] = 10; // 昏睡醒來體力滿
            player.mood = Math.max(0, player.mood - 15); // 心情大跌
            
            log(`<span style='color:#8e44ad;'>你在病床上醒來，時間已過兩天，感覺身體很沉重。</span>`);
        }

        // 月底進位處理 (簡單 30 天制)
        if (player.date.day > 30) {
            player.date.day -= 30;
            player.date.mon += 1;
        }

        updateUI();
    }

    function changeLoc(loc) {
        player.location = loc;
        updateUI();
        log(`你來到了${loc}。`);
    }

    function log(msg) {
        const area = document.getElementById('story-area');
        area.innerHTML += `<div>> ${msg}</div>`;
        area.scrollTop = area.scrollHeight;
    }

    function updateUI() {
        document.getElementById('date-display').innerText = `墨玲元年${player.date.mon}月${player.date.day}日`;
        document.getElementById('s-money').innerText = player.money;
        document.getElementById('s-sta').innerText = player.stats["s-sta"];
        document.getElementById('s-str').innerText = player.stats["s-str"];
        document.getElementById('s-int').innerText = player.stats["s-int"];
        document.getElementById('s-agi').innerText = player.stats["s-agi"];
        
        const bar = document.getElementById('mood-bar');
        bar.style.width = player.mood + "%";
        document.getElementById('mood-text').innerText = player.mood > 70 ? "開心" : (player.mood < 30 ? "鬱悶" : "平凡");

        const acts = [...new Set(actionDatabase.filter(d => d.Loc === player.location).map(d => d.Action))];
        document.getElementById('action-buttons').innerHTML = acts.map(a => `<button class="action-btn" onclick="doAction('${a}')">${a}</button>`).join('');
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(player.location)));
        
        // 更新背包
        document.getElementById('bag-books').innerHTML = player.inv.books.map(b => `<div class="item-slot"><span>📖 ${b.n}</span><span>x${b.c}</span></div>`).join('');
    }

    initGame();
</script>
</body>
</html>
